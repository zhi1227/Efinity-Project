<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="01  图片真正走的路径：Flash → FPGA → 电子纸">
<defs>
<marker id="g1-arr-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#172b46"/></marker>
<marker id="g1-arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker>
<marker id="g1-arr-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f73"/></marker>
<marker id="g1-arr-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#bd6513"/></marker>
<marker id="g1-arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#bf3b40"/></marker>
<marker id="g1-arr-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#56677c"/></marker>
</defs>
<rect width="1600" height="1000" fill="#fff"/>
<text x="50" y="57" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" fill="#172b46" font-weight="700" text-anchor="start">01  图片真正走的路径：Flash → FPGA → 电子纸</text>
<text x="50" y="94" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#56677c" font-weight="400" text-anchor="start">这是逻辑数据方向；每条外设信号的实际线路都经过 IDC40 和底板定向缓冲。</text>
<rect x="45" y="190" width="360" height="270" rx="14" fill="#edfaf6" stroke="#087f73" stroke-width="1.6"/>
<text x="67" y="224" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#087f73" font-weight="700" text-anchor="start">W25Q32 现成模块</text>
<text x="67" y="256" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">存放预先编码的表情位图</text>
<text x="67" y="284" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">标准 SPI 从设备</text>
<text x="67" y="312" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">CS / CLK / DI：接收命令</text>
<text x="67" y="340" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">DO：向 FPGA 返回图片数据</text>
<rect x="600" y="140" width="400" height="470" rx="14" fill="#f4f7ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="622" y="174" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">Ti60 FPGA 内部（待实现）</text>
<rect x="628" y="205" width="344" height="115" rx="14" fill="#f4f7ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="650" y="239" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">RISC-V 控制程序</text>
<text x="650" y="271" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">选择图片地址、调度 SPI</text>
<text x="650" y="299" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">检查状态、管理刷新间隔</text>
<rect x="628" y="349" width="344" height="87" rx="14" fill="#f4f7ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="650" y="383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">1～4 KiB RAM 小缓冲</text>
<text x="650" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">读一块，再发送一块</text>
<rect x="628" y="468" width="344" height="108" rx="14" fill="#f4f7ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="650" y="502" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">SPI_A：读 Flash</text>
<text x="650" y="534" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">SPI_B：写电子纸</text>
<text x="650" y="562" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">两组独立 CS / CLK / MOSI</text>
<rect x="1190" y="190" width="365" height="270" rx="14" fill="#fff7ed" stroke="#bd6513" stroke-width="1.6"/>
<text x="1212" y="224" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#bd6513" font-weight="700" text-anchor="start">5.79 英寸 B 电子纸模块</text>
<text x="1212" y="256" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">DIN：接收图像与命令</text>
<text x="1212" y="284" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">DC：区分命令 / 数据</text>
<text x="1212" y="312" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">收到完整图后触发刷新</text>
<text x="1212" y="340" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">BUSY：返回忙闲状态</text>
<polyline points="600,270 405,270" fill="none" stroke="#087f73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#g1-arr-teal)"/>
<text x="425" y="239" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#087f73" font-weight="700" text-anchor="start">① 读命令 + 地址</text>
<text x="427" y="303" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#087f73" font-weight="400" text-anchor="start">CS / CLK / DI</text>
<polyline points="405,395 600,395" fill="none" stroke="#087f73" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#g1-arr-teal)"/>
<text x="422" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#087f73" font-weight="700" text-anchor="start">② 图片字节 DO</text>
<polyline points="1000,270 1190,270" fill="none" stroke="#bd6513" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#g1-arr-orange)"/>
<text x="1013" y="239" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#bd6513" font-weight="700" text-anchor="start">③ 写入命令 + 数据</text>
<text x="1018" y="303" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#bd6513" font-weight="400" text-anchor="start">CLK / DIN / DC / CS</text>
<polyline points="1190,395 1000,395" fill="none" stroke="#bd6513" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#g1-arr-orange)"/>
<text x="1024" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#bd6513" font-weight="700" text-anchor="start">④ BUSY 忙闲</text>
<rect x="45" y="675" width="470" height="145" rx="14" fill="#f4f7ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="67" y="709" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">开发板 → 新底板</text>
<text x="67" y="741" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">IDC40：36 个信号 + 电源 / 地</text>
<text x="67" y="769" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">底板供电与信号侧为 3.3V</text>
<text x="67" y="797" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">FPGA 侧约束仍是 1.8V LVCMOS</text>
<rect x="563" y="675" width="470" height="145" rx="14" fill="#edfaf6" stroke="#087f73" stroke-width="1.6"/>
<text x="585" y="709" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#087f73" font-weight="700" text-anchor="start">新底板的工作</text>
<text x="585" y="741" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">连接器 + 两片 SN74LVC244A</text>
<text x="585" y="769" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">GH9P 接屏；1×6 排母接 Flash</text>
<text x="585" y="797" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">新底板无需额外 CPU 或屏升压电路</text>
<rect x="1080" y="675" width="475" height="145" rx="14" fill="#fff7ed" stroke="#bd6513" stroke-width="1.6"/>
<text x="1102" y="709" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#bd6513" font-weight="700" text-anchor="start">剩余引脚</text>
<text x="1102" y="741" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">11 个 IO 分给屏和 Flash</text>
<text x="1102" y="769" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">25 个 IO → J4 的 2×13 排针</text>
<text x="1102" y="797" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">其中 10 个属于按键 / 配置复用</text>
<rect x="45" y="855" width="1510" height="85" rx="14" fill="#fff4f4" stroke="#bf3b40" stroke-width="1.6"/>
<text x="67" y="889" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#bf3b40" font-weight="700" text-anchor="start">你当前图的三处改线</text>
<text x="67" y="921" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#172b46" font-weight="400" text-anchor="start">DIN：IO0 → IO14；RST：IO8 → IO16；PWR：IO12 → IO22。并加入缓冲和 Flash 接口。</text>
<text x="50" y="974" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#56677c" font-weight="400" text-anchor="start">画原理图时：W25 的 DO 接 FPGA 的 MISO；电子纸 DIN 接 FPGA 的另一路 MOSI，二者不要直接相连。</text>
</svg>